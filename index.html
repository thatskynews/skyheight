<script>
(function () {
  try {
    var d = document.documentElement;
    var tp = localStorage.getItem('sky-height-theme') || 'dusk';
    if (['light', 'dusk', 'dark'].indexOf(tp) < 0) tp = 'dusk';
    d.setAttribute('data-theme', tp);
    var fx = localStorage.getItem('sky-height-fx'); if (fx === 'liquid' || fx === 'frost') d.setAttribute('data-fx', fx);
    if (localStorage.getItem('sky-height-ctrl') === 'pill') d.setAttribute('data-ctrl', 'pill');
    if (d.getAttribute('data-fx') || d.getAttribute('data-ctrl') || localStorage.getItem('sky-height-exp-active') === '1') window.__expBoot = 1;
    var lg = localStorage.getItem('sky-height-lang');
    var tw = false;
    if (lg === 'tw') { lg = 'zh'; tw = true; }
    else if (lg !== 'zh' && lg !== 'en') {
      var nl = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
      if (nl.indexOf('zh') === 0) {
        lg = 'zh';
        var tz = '';
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e2) {}
        tw = /^zh-(tw|hk|mo)\b|hant/.test(nl) || (nl === 'zh' && /^Asia\/(Taipei|Hong_Kong|Macau)$/.test(tz));
      } else lg = 'en';
    }
    d.setAttribute('data-lang', lg);
    if (tw) d.setAttribute('data-tw', '1');
    d.lang = lg === 'zh' ? (tw ? 'zh-TW' : 'zh-CN') : 'en';
  } catch (e) {}
})();
</script>

html,body{height:100%;background:var(--bg);color:var(--on-surface);
  font-family:'SkyLatin',Roboto,-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;scrollbar-width:none}
body{overflow-y:auto;transition:background-color .25s,color .25s}
body::-webkit-scrollbar{display:none;width:0;height:0}
body.no-scroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}
[hidden]{display:none!important}
.floating-top{--nav-icon:var(--on-surface);position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  pointer-events:none;
  transition:background-color .25s}
.top-avatar{pointer-events:auto;position:relative;z-index:1;width:44px;height:44px;border-radius:50%;
  background:var(--surface);color:var(--nav-icon);
  display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,0.12);
  overflow:hidden;padding:0;
  transition:background-color .2s, transform .2s}
.top-avatar:active{transform:scale(.92);background:var(--surface-high)}
.top-avatar-inner{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;border-radius:50%}
.top-avatar-inner img{width:100%;height:100%;object-fit:cover;display:block}
.top-avatar-inner svg{width:24px;height:24px}
.top-avatar-inner .avatar-emoji{font-size:22px;background:transparent!important}
.actions{display:flex;align-items:center;gap:8px;pointer-events:auto;position:relative;z-index:1}
.ibtn{position:relative;overflow:hidden;width:44px;height:44px;border-radius:var(--radius-icon);display:grid;place-items:center;
  background:var(--surface);
  color:var(--nav-icon);
  box-shadow:0 4px 16px rgba(0,0,0,0.12);
  transition:background-color 360ms cubic-bezier(.2,0,0,1),transform 360ms cubic-bezier(.2,0,0,1)}
.ibtn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--surface-high);opacity:0;pointer-events:none;z-index:0;
  transition:opacity 360ms cubic-bezier(.2,0,0,1)}
.ibtn>*{position:relative;z-index:1}
.ibtn:active{transform:scale(.92);transition-duration:90ms;transition-timing-function:ease-out}
.ibtn:active::after{opacity:1;transition-duration:90ms;transition-timing-function:ease-out}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 75px) 16px calc(env(safe-area-inset-bottom) + 80px)}
.lead{color:var(--on-surface-variant);font-size:14px;line-height:1.6;margin:0 4px 16px}
.zone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:176px;
  border:1.5px dashed var(--outline);border-radius:var(--radius-zone);background:var(--surface-container);cursor:pointer;overflow:hidden;
  text-align:center;padding:20px;transition:background-color .15s,border-color .15s}
.zone.drag{background:var(--primary-container);border-color:var(--primary)}
.zone .t1{font-size:16px;font-weight:500}
.zone .t2{font-size:13px;color:var(--on-surface-variant)}
.zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.zone.has-image{
  min-height:0;
  padding:12px;
  border-color:transparent;
  background:var(--surface-container);
}
.zone.has-image .t1,
.zone.has-image .t2,
.zone.has-image #upload-icon-img{display:none}
.preview{
  display:none;
  width:100%;
  max-height:240px;
  object-fit:contain;
  border-radius:12px;
  background:var(--surface);
}
.zone.has-image .preview{display:block}
.status{margin:12px 0 0;font-size:13.5px;color:var(--on-surface-variant);min-height:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.progress-wrap{width:100%;height:4px;border-radius:99px;background:var(--surface-high);overflow:hidden;margin-top:6px;display:none}
.progress-wrap.show{display:block;animation:fadeIn .3s ease}
.progress-bar{height:100%;width:100%;border-radius:99px;overflow:hidden;transform:translateX(-100%);transition:transform .4s cubic-bezier(.22,.61,.36,1);will-change:transform}
.progress-bar>i{display:block;height:100%;width:100%;transform:translateX(100%);transition:transform .4s cubic-bezier(.22,.61,.36,1);will-change:transform}
[data-theme="dusk"] .progress-bar>i{background:linear-gradient(90deg, #8FD19E, #E8C872, #F08A7E)}
[data-theme="light"] .progress-bar>i{background:linear-gradient(90deg,#8FA6B8,#2E4A63)}
[data-theme="dark"] .progress-bar>i{background:linear-gradient(90deg, var(--primary), var(--accent))}
.progress-text{font-size:12.5px;color:var(--on-surface-variant);margin-top:4px;display:none;text-align:center}
.progress-text.show{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result{margin-top:18px;display:block}
.hero{border-radius:var(--radius-card);padding:24px 22px;background:var(--surface-container)}
[data-theme="dark"] .hero{background:var(--surface-container)}
.hero .lab{font-size:13px;letter-spacing:.3px;opacity:.85;color:var(--on-surface-variant)}
.hero .num{font-size:56px;font-weight:700;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums;color:var(--primary)}
[data-theme="light"] .hero .num{color:#2E4A63}
[data-theme="dusk"] .hero .num{color:var(--accent)}
[data-theme="dark"] .hero .num{color:var(--primary)}
.hero .type{font-size:22px;font-weight:500}
.hero .desc{font-size:14px;margin-top:4px;line-height:1.5;opacity:.85}
.meter{margin-top:22px}
.track{position:relative;height:8px;border-radius:99px;background:var(--surface-high)}
[data-theme="dusk"] .track{background:rgba(255,255,255,.1)}
.fill{position:absolute;right:0;top:0;bottom:0;border-radius:99px;width:0%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
[data-theme="dusk"] .fill{background:linear-gradient(90deg, #8FD19E, #E8C872, #F08A7E)}
[data-theme="light"] .fill{background:linear-gradient(90deg,#8FA6B8,#2E4A63)}
[data-theme="dark"] .fill{background:linear-gradient(90deg, var(--primary), var(--accent))}
.dot{position:absolute;top:50%;left:50%;width:10px;height:22px;border-radius:99px;
  background:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.15);
  transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.2,.8,.2,1)}
[data-theme="light"] .dot{background:#2E4A63}
[data-theme="dusk"] .dot{background:var(--accent)}
[data-theme="dark"] .dot{background:var(--primary)}
.ends{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cell{background:var(--surface-container);border-radius:var(--radius-card);padding:16px}
.cell .lab{font-size:12.5px;color:var(--on-surface-variant)}
.cell .val{font-size:26px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.more{margin-top:12px;background:var(--surface-container);border-radius:var(--radius-card);overflow:hidden}
.more-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px;font-size:15px;font-weight:500;text-align:left}
.more-head svg{transition:transform .2s;color:var(--on-surface-variant)}
.more.open .more-head svg{transform:rotate(180deg)}
.more-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1);}
.more-inner{overflow:hidden;padding:0 16px;font-size:13.5px;line-height:1.65;color:var(--on-surface-variant);transition:padding .3s}
.more.open .more-body{grid-template-rows:1fr}
.more.open .more-inner{padding:0 16px 16px}
.more-body b{color:var(--on-surface);font-weight:500}
.more-body p{margin-top:10px}
.kv{display:flex;justify-content:space-between;color:var(--on-surface);font-variant-numeric:tabular-nums;margin-top:6px}
.kv:first-child{margin-top:0}
.fab{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:280px;max-width:80%;min-height:52px;
  border-radius:var(--radius-btn);font-weight:500;font-size:15px;
  background:var(--primary);
  color:var(--on-primary);box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px)}
.social-links{display:flex;align-items:center;justify-content:center;gap:28px;margin:32px 0 20px;}
.social-links a{color:var(--on-surface);opacity:1;transition:opacity .2s;display:flex;align-items:center;justify-content:center;}
.social-links a:active{opacity:0.6;}
.social-links svg{fill:currentColor;}
.icon-douyin{width:24px;height:24px;}
.icon-qq{width:24px;height:24px;}
.icon-kuaishou{width:22px;height:22px;}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--surface);
  border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;
  max-height:85vh;max-height:85dvh;display:flex;flex-direction:column;visibility:hidden;box-shadow:0 -4px 24px rgba(0,0,0,.2);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%)}
.sheet.show{transform:translateY(0);visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.dragging{transition:none}

    padding: 24px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 20px;
  }

  .cell .lab {
    font-size: 15px;
  }

  .cell .val {
    font-size: 36px;
    margin-top: 0;
  }

  .more {
    margin-top: 24px;
    border-radius: 20px;
  }

  .more-head {
    padding: 20px 32px;
    font-size: 16px;
  }

  .more-inner {
    padding: 0 32px;
  }
  .more.open .more-inner {
    padding: 0 32px 24px;
  }

  .social-links {
    margin: 32px 0 100;
  }

  .sheet {
    max-width: 800px;
    border-radius: 32px;
  }

  .fab {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    margin: 0;
    width: 280px;
    height: 56px;
    border-radius: 16px;
    box-shadow: none;
    z-index: 30;
  }
  
  .fab:active {
    transform: translateX(-50%) scale(.96);
  }

  .fab.hidden {
    display: none;
  }
}

@media (min-width: 1600px) {
  .app {
    max-width: 1200px;
  }
  .floating-top {
    padding: 32px 64px;
  }
  .hero {
    padding: 40px 56px;
  }
  .hero .num {
    font-size: 88px;
  }
}

.exp-state{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:120px;padding:24px 0}
.exp-fail{margin:0 8px 16px;text-align:center;font-size:14px;line-height:1.7;color:var(--on-surface-variant)}
.exp-spin{width:24px;height:24px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--on-surface) 18%,transparent);border-top-color:var(--primary);animation:expSpin .7s linear infinite}
[data-theme="dusk"] .exp-spin,[data-theme="dusk"] .exp-state .btn.loading::after{border-top-color:var(--accent)}
.exp-state .btn{position:relative;min-width:120px}
.exp-state .btn.loading{color:transparent!important;pointer-events:none}
.exp-state .btn.loading::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid color-mix(in srgb,var(--on-surface) 18%,transparent);border-top-color:var(--primary);animation:expSpin .7s linear infinite}
@keyframes expSpin{to{transform:rotate(360deg)}}

  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

        }

      } else {

      var ctrl = window.AbortController ? new AbortController() : null;
      var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);

  function initWtaShare() {

  function dataURLtoFile(dataurl, filename) {

var avatarsState = 0, avatarCbs = [];
var AV_CACHE_DB = 'skyheight-cache', AV_CACHE_STORE = 'kv', AV_CACHE_KEY = 'avatars-v1';
function avCacheGet(cb) {
  try {
    if (!window.indexedDB) return cb(null);
    var req = indexedDB.open(AV_CACHE_DB, 1);
    req.onupgradeneeded = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains(AV_CACHE_STORE)) db.createObjectStore(AV_CACHE_STORE);
    };
    req.onerror = function () { cb(null); };
    req.onsuccess = function () {
      var db = req.result;
      try {
        var tx = db.transaction(AV_CACHE_STORE, 'readonly');
        var g = tx.objectStore(AV_CACHE_STORE).get(AV_CACHE_KEY);
        g.onsuccess = function () { cb(g.result || null); };
        g.onerror = function () { cb(null); };

    };
  } catch (e) { cb(null); }
}
function avCacheSet(arr) {

    var req = indexedDB.open(AV_CACHE_DB, 1);
    req.onupgradeneeded = function () {
      var db = req.result;

}

restoreAvatarsCache();
function loadAvatars(cb) {

  if (avatarsState === 2) {
    var done = avatarCbs; avatarCbs = [];
    done.forEach(function (f) { try { f(); } catch (e) {} });

    } else if (n === 0) {

    } else {

      dlogRaw(hasB64 ? 'ok' : 'warn', 'boot',
        'avatars.js 加载成功 / loaded · ' + n + ' 项/item(s) · ' + ms + 'ms' +
        (hasB64 ? '' : ' · 首项缺少 b64 / first item missing b64'));
